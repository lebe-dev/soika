# Example declarative configuration for Soika.
# Setup and ready-to-use Alertmanager examples: docs/ALERTMANAGER.md.
# Example environment (copy/mount this file at CONFIG_PATH):
# CONFIG_PATH=/etc/soika/config.yaml
# PROJECT_MANAGEMENT_SOURCE=yaml
# TEAM_MANAGEMENT_SOURCE=yaml
# SERVICE_MANAGEMENT_SOURCE=env
# NOTIFICATIONS_ALERTMANAGER_ENABLED=true
# ALERTMANAGER_URL=http://alertmanager.monitoring:9093
# ALERTMANAGER_DEFAULT_INTERVAL_SECONDS=300
# ALERTMANAGER_DEFAULT_SEVERITY=warning
# BASE_URL=https://errors.example.com
# The file is read once at startup from CONFIG_PATH (default /etc/soika/config.yaml);
# restart the service to apply changes. Each section is used only when its
# management source selects the file; sections owned by the UI are ignored.
# String values may reference environment variables as ${NAME}; an unset
# variable fails startup. Never put DSNs or credentials in this file.

# Schema version; must be 1.
version: 1

# Teams, read when TEAM_MANAGEMENT_SOURCE=yaml. Required in that mode
# (use `teams: []` explicitly for none). Teams are matched by name: renaming
# creates a new team, and missing teams follow TEAM_ORPHAN_POLICY.
teams:
  - name: Platform # Unique display name; projects reference it.
    # Email grants. Entries do not create users: the grant applies when the
    # person signs in. Role is admin (manages the team) or contributor.
    members:
      - email: alice@example.com
        role: admin
      - email: bob@example.com
        role: contributor
    # SSO group grants; require OAUTH_PROVIDER=oidc with a groups claim
    # (OAUTH_GROUPS_CLAIM). Group paths match exactly, including case.
    # sso_groups:
    #   - group: acme/platform
    #     role: contributor
  - name: Web
    # A team needs members or sso_groups; an empty list keeps it empty on purpose.
    members: []

# Projects, read when PROJECT_MANAGEMENT_SOURCE=yaml. Required in that mode
# (use `projects: []` explicitly for none). Projects are matched by slug:
# changing a slug creates a new project with a new DSN, and missing projects
# follow PROJECT_ORPHAN_POLICY.
projects:
  - slug: backend-api # Unique lowercase slug: letters, digits and dashes.
    name: Backend API # Display name.
    team: Platform # Owning team; must exist in the file or in the UI.
    retention_events: 5000 # Max stored events (>= 1); default DEFAULT_EVENTS_RETENTION.
    retention_days: 30 # Max event age in days; 0 or omitted falls back to DEFAULT_RETENTION_DAYS.
    # Refresh this project's active alerts every 120 seconds, overriding ALERTMANAGER_DEFAULT_INTERVAL_SECONDS.
    alertmanager_interval_seconds: 120
    # Severity mode: fixed or event; omit/null inherits the global mode.
    # Event mode maps fatal/error -> critical, warning -> warning, info/debug -> info.
    # The issue retains its lifetime maximum, including across regressions.
    # alertmanager_severity_mode: event
    # Alertmanager class: critical, warning or info. Overrides the severity label
    # from notification templates and project_labels; does not change event levels.
    # In event mode this is the fallback for missing/unknown levels.
    # An explicit class without a mode selects fixed mode for compatibility.
    # Omit both fields or set both null to inherit the global mode and severity.
    alertmanager_severity: critical
    # Outgoing webhook (http/https); omit to disable this channel.
    # webhook_url: ${BACKEND_WEBHOOK_URL}
  - slug: frontend
    name: Frontend
    team: Web
    # No interval override: inherits the global default (300 in the env example).
    alertmanager_severity: warning
    # To remove overrides and restore defaults explicitly:
    # alertmanager_interval_seconds: null
    # alertmanager_severity: null

# Notifications. With SERVICE_MANAGEMENT_SOURCE=env only
# alertmanager.project_labels is read; with ui the section is ignored.
notifications:
  alertmanager:
    # Extra Alertmanager labels per project slug; they override default labels
    # with the same name. Values accept templates such as {{ level }}.
    # An explicit projects[].alertmanager_severity takes precedence over severity
    # from this map; the global default severity also takes precedence.
    # Routing labels do not enable the channel: set
    # NOTIFICATIONS_ALERTMANAGER_ENABLED=true and ALERTMANAGER_URL as documented.
    project_labels:
      backend-api:
        team: platform
        chat: service-general-status
      frontend:
        team: web

# Channel settings and global defaults are configured through env or the admin UI.
# See docs/NOTIFICATIONS.md for legacy configuration compatibility.
