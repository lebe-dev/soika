sonar.projectKey=soika
sonar.projectName=soika
# sonar.projectVersion is passed at scan time from Cargo.toml (see `just sonar-scan`).

sonar.sourceEncoding=UTF-8

# --- Sources ---
# Analyse the whole repo, minus vendored/generated/build artifacts and test code
# (test files are picked up separately via sonar.test.inclusions below).
sonar.sources=.
sonar.exclusions=\
  target/**,\
  frontend/node_modules/**,\
  frontend/.svelte-kit/**,\
  frontend/build/**,\
  frontend/dist/**,\
  web/dist/**,\
  data/**,\
  **/testdata/**

# --- Tests ---
sonar.tests=.
sonar.test.inclusions=\
  tests/**/*.rs,\
  frontend/**/*.test.ts,\
  frontend/**/*.spec.ts

# --- Coverage (optional; generated by your test/coverage recipes) ---
# Rust: generate with `cargo llvm-cov --lcov --output-path lcov.info`
# sonar.rust.lcov.reportPaths=lcov.info
# Frontend: generated by `just test-frontend-coverage`
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
