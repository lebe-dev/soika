[package]
name = "soika"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Lightweight, Sentry-compatible error tracking system written in Rust"
license = "MIT"
repository = "https://github.com/tinyops/soika"
default-run = "soika"

# Library crate: domain logic, ingestion, grouping, persistence, mailer, scheduler.
[lib]
name = "soika"
path = "src/lib.rs"

# Binary crate: wiring, config loading, axum bootstrap, graceful shutdown.
[[bin]]
name = "soika"
path = "src/main.rs"

[dependencies]
# HTTP / async runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "fs", "trace"] }

# Persistence (SQLite for MVP, ANSI-friendly so Postgres can be added later)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors — thiserror for the lib, anyhow for the bin.
thiserror = "1"
anyhow = "1"

# Auth / crypto
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
# HMAC-SHA256 signing for session cookies / invite tokens (src/auth/signing.rs).
hmac = "0.12"
sha2 = "0.10"

# Email (SMTP via lettre)
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }

# Outbound HTTP for the webhook notification channel (Story 6.2). rustls (not
# native-tls) to match sqlx/lettre and avoid pulling in openssl; no
# default-features so we drop default-tls/charset/http2 we don't need.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embedded frontend assets
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
flate2 = "1"
croner = "2"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
