services:
  soika:
    container_name: soika
    image: tinyops/soika:0.9.0
    restart: always
    environment:
      BIND_ADDR: "0.0.0.0:8080"
    volumes:
      - ./deploy/config.yaml:/etc/soika/config.yaml:ro
    env_file:
      - .env
    ports:
      - "8080:8080"

    deploy:
      resources:
        limits:
          cpus: "1"
          # Required only for aragon hashing
          memory: 128M
