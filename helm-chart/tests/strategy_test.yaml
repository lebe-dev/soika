suite: deployment strategy
templates:
  - deployment.yaml
  - configmap.yaml
  - secret.yaml
tests:
  - it: recreates the pod by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate
  - it: renders a configured rolling update strategy
    template: deployment.yaml
    set:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
