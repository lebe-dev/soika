# Keep one replica on either database: scheduler and rate limits are per process.
# Soika runs the selected database's migrations at startup.
replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: tinyops/soika
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.appVersion.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-sensitive application settings. See .env.example for all available keys.
# Set BASE_URL to the public URL used by users and Sentry SDKs.
envs:
  - name: BIND_ADDR
    value: "0.0.0.0:8080"
  - name: DATABASE_URL
    value: "sqlite:///app/data/soika.db?mode=rwc"
  - name: BASE_URL
    value: "http://localhost:8080"
  # Full emails with effective Owner rights; comma-separated, case-insensitive.
  # Removing an email restores its stored role after the Helm-triggered rollout.
  - name: ADMIN_USERS
    value: ""
  - name: SMTP_ENABLED
    value: "false"

# Set SECRET_KEY before installing. An empty key causes Soika to reject startup.
# Alternatively, set create: false and existingSecret to a Secret containing
# SECRET_KEY (and any other sensitive environment variables).
secrets:
  create: true
  existingSecret: ""
  annotations: {}
  envs:
    - name: SECRET_KEY
      value: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

livenessProbe:
  httpGet:
    path: /healthz
    port: http
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: errors.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - errors.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# SQLite: use block storage with working file locks (not NFS/SMB).
# PostgreSQL: set enabled: false; the external database holds persistent data.
# If existingClaim is set, the chart does not create a PVC.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: "" # Empty uses the cluster default StorageClass.
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations:
    helm.sh/resource-policy: keep

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraObjects: []
