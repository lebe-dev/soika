# Keep one replica on either database: scheduler and rate limits are per process.
# Soika runs the selected database's migrations at startup.
replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: tinyops/soika
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.appVersion.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-sensitive application settings. See .env.example for all available keys.
# Set BASE_URL to the public URL used by users and Sentry SDKs.
envs:
  - name: PROJECT_MANAGEMENT_SOURCE
    value: "ui"
  - name: TEAM_MANAGEMENT_SOURCE
    value: "ui"
  - name: NOTIFICATIONS_ALERTMANAGER_ENABLED
    value: "false"
  # General service settings source: ui (default) or env (read-only in UI).
  - name: SERVICE_MANAGEMENT_SOURCE
    value: "ui"
  # In env mode: ORGANIZATION_NAME, ALLOW_SIGNUP, DEFAULT_TEAM_IDS and
  # Alertmanager envs control settings; admin edits and test alerts are blocked.
  # DEFAULT_TEAM_IDS is a comma-separated list of existing team UUIDs (default empty).
  # Default URL; an explicit URL in UI/YAML takes precedence.
  # Base URL only, e.g. https://somehost.com/ or https://somehost.com/alertmanager/.
  # Soika appends /api/v2/alerts automatically; do not include that endpoint.
  - name: ALERTMANAGER_URL
    value: ""
  - name: CONFIG_PATH
    value: "/etc/soika/config.yaml"
  # delete permanently removes missing projects and their events.
  - name: PROJECT_ORPHAN_POLICY
    value: "readonly"
  # delete fails if a missing team still owns projects.
  - name: TEAM_ORPHAN_POLICY
    value: "readonly"
  - name: BIND_ADDR
    value: "0.0.0.0:8080"
  - name: DATABASE_URL
    value: "sqlite:///app/data/soika.db?mode=rwc"
  - name: BASE_URL
    value: "http://localhost:8080"
  # Full emails with effective Owner rights; comma-separated, case-insensitive.
  # Removing an email restores its stored role after the Helm-triggered rollout.
  - name: ADMIN_USERS
    value: ""
  - name: ADMIN_ENABLED
    value: "true"
  # Disable email/password sign-in for all users, including Owners.
  - name: EMAIL_LOGIN_ENABLED
    value: "true"
  # Allow SSO users to edit their display name in the profile.
  - name: SSO_ALLOW_DISPLAY_NAME_CHANGE
    value: "false"
  - name: SMTP_ENABLED
    value: "false"
  - name: WEBHOOKS_ENABLED
    value: "false"

# Set SECRET_KEY before installing. An empty key causes Soika to reject startup.
# Alternatively, set create: false and existingSecret to a Secret containing
# SECRET_KEY (and any other sensitive environment variables).
secrets:
  create: true
  existingSecret: ""
  annotations: {}
  envs:
    - name: SECRET_KEY
      value: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

livenessProbe:
  httpGet:
    path: /healthz
    port: http
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: errors.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - errors.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# SQLite: use block storage with working file locks (not NFS/SMB).
# PostgreSQL: set enabled: false; the external database holds persistent data.
# If existingClaim is set, the chart does not create a PVC.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: "" # Empty uses the cluster default StorageClass.
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations:
    helm.sh/resource-policy: keep

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraObjects: []

# Mount a configuration file; enable yaml sources above to use it.
configFile:
  existingConfigMap: ""
  content:
    version: 1
    projects: []
    teams: []
    # Alertmanager values support literal {{ variable }} placeholders.
    # Legacy YAML notification management uses NOTIFICATION_MANAGEMENT_SOURCE=yaml
    # with SERVICE_MANAGEMENT_SOURCE omitted; env mode ignores this section.
    notifications:
      alertmanager:
        enabled: false
        # Base URL only; Soika appends /api/v2/alerts automatically.
        # Empty uses ALERTMANAGER_URL from the environment.
        url: ""
        labels:
          alertname: SoikaIssue
          project: "{{ project_slug }}"
          severity: "{{ level }}"
        annotations:
          summary: "{{ title }}"
          description: "{{ culprit }}"
          issue_url: "{{ issue_url }}"
          trigger: "{{ trigger }}"
          environment: "{{ environment }}"
          release: "{{ release }}"
          event_count: "{{ event_count }}"
