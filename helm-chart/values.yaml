# Keep one replica on either database: scheduler and rate limits are per process.
# Soika runs the selected database's migrations at startup.
replicaCount: 1
revisionHistoryLimit: 2
strategy:
  type: Recreate

image:
  repository: tinyops/soika
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.appVersion.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-sensitive application settings. See .env.example for all available keys.
# Set BASE_URL to the public URL used by users and Sentry SDKs.
envs:
  - name: PROJECT_MANAGEMENT_SOURCE
    value: "ui"
  - name: TEAM_MANAGEMENT_SOURCE
    value: "ui"
  - name: NOTIFICATIONS_ALERTMANAGER_ENABLED
    value: "false"
  # General service settings source: ui (default) or env (read-only in UI).
  - name: SERVICE_MANAGEMENT_SOURCE
    value: "ui"
  # ALLOW_INVITES=true enables team invite links (default false); ignored when teams are managed by YAML.
  # In env mode: ORGANIZATION_NAME, ALLOW_SIGNUP, DEFAULT_TEAM_IDS and
  # Alertmanager envs control settings; admin edits and test alerts are blocked.
  # DEFAULT_TEAM_IDS is a comma-separated list of existing team UUIDs (default empty).
  # Default URL; an explicit URL in UI/YAML takes precedence.
  # Base URL only, e.g. https://somehost.com/ or https://somehost.com/alertmanager/.
  # Soika appends /api/v2/alerts automatically; do not include that endpoint.
  - name: ALERTMANAGER_URL
    value: ""
  # Disable certificate verification only for Alertmanager HTTPS requests.
  - name: ALERTMANAGER_SKIP_TLS
    value: "false"
  - name: CONFIG_PATH
    value: "/etc/soika/config.yaml"
  # delete permanently removes missing projects and their events.
  - name: PROJECT_ORPHAN_POLICY
    value: "readonly"
  # delete fails if a missing team still owns projects.
  - name: TEAM_ORPHAN_POLICY
    value: "readonly"
  - name: BIND_ADDR
    value: "0.0.0.0:8080"
  - name: DATABASE_URL
    value: "sqlite:///app/data/soika.db?mode=rwc"
  - name: BASE_URL
    value: "http://localhost:8080"
  # Full emails with effective Owner rights; comma-separated, case-insensitive.
  # Removing an email restores its stored role after the Helm-triggered rollout.
  - name: ADMIN_USERS
    value: ""
  - name: ADMIN_ENABLED
    value: "true"
  # Disable email/password sign-in for all users, including Owners.
  - name: EMAIL_LOGIN_ENABLED
    value: "true"
  # Allow SSO users to edit their display name in the profile.
  - name: SSO_ALLOW_DISPLAY_NAME_CHANGE
    value: "false"
  - name: SMTP_ENABLED
    value: "false"
  - name: WEBHOOKS_ENABLED
    value: "false"
  - name: ORGANIZATION_NAME
    value: "soika"
  # IANA timezone used by the UI to display timestamps; dates are stored in UTC.
  - name: TIMEZONE
    value: "UTC"
  - name: ALLOW_SIGNUP
    value: "false"
  - name: ALLOW_INVITES
    value: "false"
  - name: DEFAULT_EVENTS_RETENTION
    value: "1000"
  # Age-based pruning in days; 0 disables it.
  - name: DEFAULT_RETENTION_DAYS
    value: "0"
  # Six-field cron (with seconds) for the retention cleanup job.
  - name: RETENTION_CRON
    value: "0 */15 * * * *"
  - name: OAUTH_ENABLED
    value: "false"
  # Passkeys cannot be enabled together with OAUTH_ENABLED.
  - name: PASSKEY_ENABLED
    value: "false"
  - name: LOGIN_LOCKOUT_ENABLED
    value: "true"
  - name: RUST_LOG
    value: "info"
  # Optional settings, uncomment and add to the list as needed (the list is
  # replaced as a whole by an override). See .env.example for details.
  # Link to the deployment configuration shown to instance managers (http/https):
  #   SERVICE_DEPLOY_URL
  # Comma-separated name=value pairs extending default Alertmanager labels (env mode):
  #   ALERTMANAGER_DEFAULT_LABELS
  # Comma-separated existing team UUIDs used as default teams (env mode):
  #   DEFAULT_TEAM_IDS
  # Database pool and write retries (SQLite and PostgreSQL):
  #   DB_MAX_CONNECTIONS, DB_ACQUIRE_TIMEOUT_MS, DB_WRITE_MAX_RETRIES,
  #   DB_WRITE_RETRY_BASE_MS, DB_WRITE_RETRY_MAX_MS, DB_DELETE_BATCH,
  #   DB_BUSY_RETRY_AFTER_SECS
  # SQLite only:
  #   DB_BUSY_TIMEOUT_MS, DB_SYNCHRONOUS
  # Login throttling:
  #   LOGIN_MAX_ATTEMPTS, LOGIN_LOCKOUT_WINDOW_SECS, LOGIN_LOCKOUT_BASE_SECS,
  #   LOGIN_LOCKOUT_MAX_SECS
  # SMTP (SMTP_PASSWORD belongs in secrets.envs):
  #   SMTP_HOST, SMTP_PORT, SMTP_TLS, SMTP_USERNAME, SMTP_FROM
  # OAuth/OIDC (OAUTH_CLIENT_SECRET belongs in secrets.envs):
  #   OAUTH_PROVIDER, OAUTH_ISSUER_URL, OAUTH_CLIENT_ID, OAUTH_REDIRECT_URL,
  #   OAUTH_SCOPES, OAUTH_PROVIDER_NAME, OAUTH_ALLOWED_EMAIL_DOMAINS,
  #   OAUTH_REQUIRE_APPROVAL, OAUTH_GROUPS_CLAIM
  # Passkeys:
  #   PASSKEY_RP_ID, PASSKEY_RP_NAME, PASSKEY_RP_ORIGIN, PASSKEY_EXTRA_ORIGINS,
  #   PASSKEY_ALLOW_SUBDOMAINS, PASSKEY_TIMEOUT_SECONDS,
  #   PASSKEY_CHALLENGE_TTL_SECONDS, PASSKEY_MAX_PER_USER
  # Soika's own error reporting (SENTRY_DSN belongs in secrets.envs):
  #   SENTRY_ENVIRONMENT

# Set SECRET_KEY before installing. An empty key causes Soika to reject startup.
# Alternatively, set create: false and existingSecret to a Secret containing
# SECRET_KEY (and any other sensitive environment variables).
secrets:
  create: true
  existingSecret: ""
  annotations: {}
  # Sensitive optional variables go here too: SMTP_PASSWORD, OAUTH_CLIENT_SECRET,
  # SENTRY_DSN, and DATABASE_URL when it contains a password.
  envs:
    - name: SECRET_KEY
      value: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
# Optional static hostname mappings for the Pod.
hostAliases: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

livenessProbe:
  httpGet:
    path: /healthz
    port: http
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: errors.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - errors.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# SQLite: use block storage with working file locks (not NFS/SMB).
# PostgreSQL: set enabled: false; the external database holds persistent data.
# If existingClaim is set, the chart does not create a PVC.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: "" # Empty uses the cluster default StorageClass.
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations:
    helm.sh/resource-policy: keep

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraObjects: []

# Mount a configuration file; enable yaml sources above to use it.
configFile:
  existingConfigMap: ""
  content:
    version: 1
    projects: []
    teams: []
    # Alertmanager values support literal {{ variable }} placeholders.
    # Legacy YAML notification management uses NOTIFICATION_MANAGEMENT_SOURCE=yaml
    # with SERVICE_MANAGEMENT_SOURCE omitted; env mode reads only project_labels.
    notifications:
      alertmanager:
        # In env mode, project labels override ALERTMANAGER_DEFAULT_LABELS by slug.
        # project_labels:
        #   api:
        #     team: platform
        enabled: false
        # Base URL only; Soika appends /api/v2/alerts automatically.
        # Empty uses ALERTMANAGER_URL from the environment.
        url: ""
        labels:
          alertname: SoikaIssue
          project: "{{ project_slug }}"
          severity: "{{ level }}"
        annotations:
          summary: "{{ title }}"
          description: "{{ culprit }}"
          issue_url: "{{ issue_url }}"
          trigger: "{{ trigger }}"
          environment: "{{ environment }}"
          release: "{{ release }}"
          event_count: "{{ event_count }}"
