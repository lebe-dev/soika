{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soika.secretName" . }}
  labels:
    {{- include "soika.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range .Values.secrets.envs }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}
{{- end }}
